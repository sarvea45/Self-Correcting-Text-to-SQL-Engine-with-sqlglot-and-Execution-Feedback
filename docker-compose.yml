version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_messy
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/seed_db.sql:/docker-entrypoint-initdb.d/seed_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_messy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=ecommerce_messy
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gemini-3.1-pro}
    depends_on:
      postgres:
        condition: service_healthy
